[project]
name = "tourism-intel"
version = "0.1.0"
description = "Cambodia Tourism Intelligence & Demand Analytics"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "duckdb>=1.0", "pyarrow>=15", "pyyaml>=6", "openpyxl>=3.1",
  "streamlit>=1.40", "plotly>=5.20", "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
